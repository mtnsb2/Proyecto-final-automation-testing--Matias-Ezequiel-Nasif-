name: Tests automatizados

on:
    push:
      branches:
          - main
         

jobs:
    run-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Descargar repositorio
              uses: actions/checkout@v4

            - name: Configurar python
              uses: actions/setup-python@v5
              with:
                python-version: "3.14.7"

            - name: Instalar dependencias
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Ejecutar pruebas
              run: pytest --ignore="old tests" --ignore=tests_sim_error --html=report.html --self-contained-html  #la prueba funciona sin --ignore=tests_sim_error tambien ,crea el reporte html con screenshots en github

            - name: Guardar reporte como artefacto
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: reporte-pytest-html
                path: report.html
